name: UI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: r_test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.43.0-jammy

    steps:
    - uses: actions/checkout@v2
    - name: Install modules
      working-directory: ./web/ui-next
      run: yarn

    - uses: actions/checkout@v2
    - name: Run tests
      working-directory: ./web/ui-next
      run: yarn test
